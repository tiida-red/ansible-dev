---
- name: Search installed packages and/or check CVE on RHEL hosts
  hosts: "{{ target_hostname | default('all') }}"
  gather_facts: false
  become: true # rpm / dnf updateinfo の参照に使用 (システムは変更しません)

  vars:
    # --- AAP の Survey から渡される変数 (どちらも任意。両方空はエラー) ---
    search_packages: "" # カンマ区切りで複数指定可。* でワイルドカード (例: "php*,httpd*")
    cve_ids: "" # カンマ区切りで複数指定可 (例: "CVE-2024-1234,CVE-2024-5678")
    # --- 内部で使うリスト ---
    search_package_list: "{{ search_packages.split(',') | map('trim') | select | list }}"
    cve_list: "{{ cve_ids.split(',') | map('trim') | select | list }}"

  tasks:
    - name: Ensure at least one of search_packages or cve_ids is specified
      ansible.builtin.assert:
        that: (search_package_list | length > 0) or (cve_list | length > 0)
        fail_msg: "search_packages (例: php*) か cve_ids (例: CVE-2024-1234) の少なくとも一方を指定してください。"
      run_once: true # noqa: run-once[task]

    # --------------------------------------------------
    # 1. パッケージ検索 (search_packages 指定時のみ。参照のみ)
    # --------------------------------------------------
    - name: インストール済みパッケージを検索
      ansible.builtin.command:
        argv: "{{ ['rpm', '-qa', '--qf', '%{NAME} %{VERSION}-%{RELEASE}.%{ARCH}\\n'] + search_package_list }}"
      register: rpm_result
      changed_when: false
      when: search_package_list | length > 0

    - name: 一致したパッケージを整理
      ansible.builtin.set_fact:
        found_packages: "{{ rpm_result.stdout_lines | default([]) | map('trim') | select | sort | list }}"

    # --------------------------------------------------
    # 2. CVE チェック (cve_ids 指定時のみ。パッケージ検索とは独立。参照のみ)
    # --------------------------------------------------
    - name: 指定 CVE の未適用アドバイザリを取得
      ansible.builtin.command: "dnf -q updateinfo list --cve {{ item }}"
      loop: "{{ cve_list }}"
      register: cve_result
      changed_when: false
      failed_when: false # 失敗しても止めず、下でエラーとして表示する

    - name: CVE の該当行とエラーを整理
      ansible.builtin.set_fact:
        cve_findings: >-
          {{ cve_result.results | default([])
          | map(attribute='stdout_lines') | flatten
          | map('trim') | select | unique | sort | list }}
        cve_errors: >-
          {{ cve_result.results | default([])
          | rejectattr('rc', 'equalto', 0)
          | map(attribute='item') | list }}

    - name: CVE チェックのエラー詳細を表示
      ansible.builtin.debug:
        msg: "{{ item.item }}: rc={{ item.rc }} {{ item.stderr | default('') }}"
      loop: "{{ cve_result.results | default([]) | rejectattr('rc', 'equalto', 0) | list }}"
      loop_control:
        label: "{{ item.item }}"

    # --------------------------------------------------
    # 3. ホストごとの結果
    # --------------------------------------------------
    - name: ホストごとの結果を表示
      ansible.builtin.debug:
        msg: >-
          {{ ['Host : ' ~ inventory_hostname]
          + (['パッケージ検索 [' ~ search_package_list | join(', ') ~ '] : '
              ~ (found_packages if found_packages | length > 0 else '(該当なし)')]
             if search_package_list | length > 0 else [])
          + (['CVE [' ~ cve_list | join(', ') ~ '] 未適用 : '
              ~ (cve_findings if cve_findings | length > 0 else '(なし)')
              ~ (' ※エラー: ' ~ cve_errors | join(', ') if cve_errors | length > 0 else '')]
             if cve_list | length > 0 else []) }}

    # --------------------------------------------------
    # 4. 全ホストの集計 (1回だけ実行)
    # --------------------------------------------------
    - name: パッケージが見つかったホストを集計
      ansible.builtin.set_fact:
        summary_pkg_hit: "{{ summary_pkg_hit | default([]) + [item] }}"
      loop: "{{ ansible_play_hosts }}"
      run_once: true # noqa: run-once[task]
      when: hostvars[item].found_packages | default([]) | length > 0

    - name: CVE が未適用のホストを集計
      ansible.builtin.set_fact:
        summary_cve_hit: "{{ summary_cve_hit | default([]) + [item] }}"
      loop: "{{ ansible_play_hosts }}"
      run_once: true # noqa: run-once[task]
      when: hostvars[item].cve_findings | default([]) | length > 0

    - name: 集計結果 - パッケージが見つかったホスト
      ansible.builtin.debug:
        msg: "{{ item }}: {{ hostvars[item].found_packages | join(', ') }}"
      loop: "{{ summary_pkg_hit | default([]) }}"
      run_once: true # noqa: run-once[task]

    - name: 集計結果 - 件数
      ansible.builtin.debug:
        msg: >-
          {{ (['パッケージ検索: 該当あり ' ~ summary_pkg_hit | default([]) | length ~ ' 台 '
               ~ summary_pkg_hit | default([]) ~ ' / 全 ' ~ ansible_play_hosts | length ~ ' 台']
              if search_package_list | length > 0 else [])
          + (['CVE: 未適用あり ' ~ summary_cve_hit | default([]) | length ~ ' 台 '
              ~ summary_cve_hit | default([]) ~ ' / 全 ' ~ ansible_play_hosts | length ~ ' 台']
              if cve_list | length > 0 else []) }}
      run_once: true # noqa: run-once[task]
