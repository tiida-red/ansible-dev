---
- name: 対象インスタンスの特定と動的インベントリ追加
  hosts: all
  gather_facts: false
  become: true # root 権限で実行

  vars:
    region: "ap-northeast-1"
    services_to_enable: # firewalldで許可するサービス名のリスト ["service", "service2", ...]
      - http
      - https
    ports_to_open:
      - 8080/tcp
      - 8443/tcp

  tasks:

    # --------------------------------------------------
    # 1. firewalld サービスの有効化と起動
    # --------------------------------------------------
    - name: firewalld パッケージのインストール確認
      ansible.builtin.dnf:
        name: firewalld
        state: present

    - name: firewalld サービスの起動と自動起動設定
      ansible.builtin.systemd:
        name: firewalld
        state: started
        enabled: true

    # 【重要】firewalld サービスが完全に応答可能になるまで待機
    - name: firewalld が完全起動して応答するまで待機
      ansible.builtin.command: firewall-cmd --state
      register: firewall_state
      until: firewall_state.stdout == "running"
      retries: 5
      delay: 2
      changed_when: false
      failed_when: false # 起動途中の rc != 0 で失敗させないための設定

    # --------------------------------------------------
    # 2. Firewall ルールの設定 
    # --------------------------------------------------
    - name: サービス名指定でポートを許可 
      ansible.posix.firewalld:
        service: "{{ item }}"
        permanent: true
        state: enabled
        immediate: true
      loop: "{{ services_to_enable }}"

    - name: ポート番号指定で許可 (8080/tcp, 8443/tcp)
      ansible.posix.firewalld:
        port: "{{ item }}"
        permanent: true
        state: enabled
        immediate: true
      loop: "{{ ports_to_open }}"

    - name: 設定を反映するために firewalld をリロード
      ansible.builtin.systemd:
        name: firewalld
        state: reloaded

    - name: 現在の firewalld 設定を表示 (デバッグ用)
      ansible.builtin.command: firewall-cmd --list-all
      register: firewall_config
      changed_when: false
    - name: Show current firewalld configuration for debugging
      ansible.builtin.debug:
        msg: "Current firewalld configuration: {{ firewall_config.stdout }}"

