---
- name: Install and enable AWS Systems Manager Agent
  hosts: all
  become: true
  gather_facts: true

  vars:
    ssm_region: us-east-1
    ssm_agent_rpm: /tmp/amazon-ssm-agent.rpm
    ssm_agent_download_url: https://s3.amazonaws.com/ec2-downloads-windows/SSMAgent/latest/linux_amd64/amazon-ssm-agent.rpm

  tasks:
    - name: Check if SSM Agent is already installed
      ansible.builtin.command: rpm -q amazon-ssm-agent
      register: ssm_agent_check
      ignore_errors: true

    - name: Download SSM Agent package
      ansible.builtin.get_url:
        url: "{{ ssm_agent_download_url }}"
        dest: "{{ ssm_agent_rpm }}"
        mode: '0644'

    - name: Install SSM Agent package
      ansible.builtin.dnf:
        name: "{{ ssm_agent_rpm }}"
        state: present
        disable_gpg_check: true

    - name: Enable and start SSM Agent
      ansible.builtin.systemd:
        name: amazon-ssm-agent
        enabled: true
        state: started
