---
- name: Install and enable AWS Systems Manager Agent
  hosts: all
  become: true
  gather_facts: true

  vars:
    ssm_region: us-east-1
    ssm_agent_rpm: /tmp/amazon-ssm-agent.rpm
    ssm_agent_download_url: "https://s3.{{ ssm_region }}.amazonaws.com/amazon-ssm-{{ ssm_region }}/latest/linux_amd64/amazon-ssm-agent.rpm"
    ssm_agent_gpg_key_url: "https://s3.{{ ssm_region }}.amazonaws.com/amazon-ssm-{{ ssm_region }}/latest/linux_amd64/amazon-ssm-agent.rpm.sig"

  tasks:
    - name: Import SSM Agent GPG key
      ansible.builtin.rpm_key:
        state: present
        key: "{{ ssm_agent_gpg_key_url }}"

    - name: Download SSM Agent package
      ansible.builtin.get_url:
        url: "{{ ssm_agent_download_url }}"
        dest: "{{ ssm_agent_rpm }}"
        mode: '0644'

    - name: Install SSM Agent package
      ansible.builtin.dnf:
        name: "{{ ssm_agent_rpm }}"
        state: present

    - name: Enable and start SSM Agent
      ansible.builtin.systemd:
        name: amazon-ssm-agent
        enabled: true
        state: started
