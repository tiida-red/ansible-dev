---
- name: 対象インスタンスの特定と動的インベントリ追加
  hosts: localhost
  gather_facts: false
  vars:
    target_hostname: "my-rhel-server" # 対象のインスタンス名（Nameタグ）を指定
    region: "ap-northeast-1"


  tasks:
    - name: ホスト名(Nameタグ)からEC2インスタンス情報を取得
      amazon.aws.ec2_instance_info:
        region: "{{ region }}"
        filters:
          "tag:Name": "{{ target_hostname }}"
          "instance-state-name": "running"
      register: ec2_info

    - name: インスタンスが見つかったか確認
      ansible.builtin.assert:
        that:
          - ec2_info.instances | length > 0
        fail_msg: "指定されたホスト名 '{{ target_hostname }}' の実行中インスタンスが見つかりません。"

    - name: ターゲットホストを動的インベントリに追加
      ansible.builtin.add_host:
        name: "{{ ec2_info.instances[0].private_ip_address }}" # public_ip_address または private_ip_address
        groups: target_rhel_servers
        ansible_user: ec2-user # 必要に応じて ec2-user や root に変更してください


- name: RHEL の Firewall 設定および OS パッチ適用
  hosts: target_rhel_servers
  become: true # root 権限で実行
  gather_facts: true
  vars:
    reboot_after_patch: true # OSパッチ適用後に再起動するか
    reboot_timeout: 600

  tasks:
    # --------------------------------------------------
    # 1. OS パッチの最新化
    # --------------------------------------------------
    - name: すべてのパッケージを最新化 (OSパッチ適用)
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_cache: true

    # ============================================================
    # 2. Reboot必要性確認
    # ============================================================
    - name: Check if reboot is required
      ansible.builtin.command:
        cmd: needs-restarting -r
      register: reboot_check
      changed_when: false
      failed_when: false

    - name: Set reboot required
      ansible.builtin.set_fact:
        reboot_required: "{{ reboot_check.rc != 0 }}"

    - name: Show reboot requirement
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "REBOOT CHECK"
          - "Host : {{ inventory_hostname }}"
          - "Reboot Required : {{ reboot_required }}"
          - "=========================================="
  
    - name: Reboot server 
      ansible.builtin.reboot:
        reboot_timeout: "{{ reboot_timeout }}"
        test_command: whoami
        msg: "Reboot requested by Ansible RHEL patch Playbook"
      when:
        - reboot_after_patch | bool
        - reboot_required | bool
  