---
- name: "RHEL Update and Reboot Playbook"
  hosts: "{{ target_hostname | default('all') }}"
  gather_facts: true
  become: true # root 権限で実行
  vars:
    region: "ap-northeast-1"
    reboot_after_patch: true # OSパッチ適用後に再起動するか
    # --- AAP の Survey から渡される変数 ---
    update_mode: apply # apply: 更新を実行 / check: 更新の有無を確認するだけ (何も変更しない)
    update_scope: all # all: すべての更新 / security: セキュリティ更新のみ
    update_packages: "" # 空: すべて / カンマ区切りで指定: 指定パッケージのみ (例: "kernel,openssl")
    # --- 内部で使うリスト ---
    update_package_list: "{{ update_packages.split(',') | map('trim') | select | list }}"
    reboot_timeout: 600

  tasks:
    - name: inventoryで登録されているホスト一覧を取得
      ansible.builtin.debug:
        msg: "対象ホスト: {{ inventory_hostname }} のパッケージを{{ '最新に更新します' if update_mode == 'apply' else '確認します (更新はしません)' }}"

    # --------------------------------------------------
    # 1. OS パッチの最新化
    # --------------------------------------------------
    - name: update_scope と update_mode の値を検証
      ansible.builtin.assert:
        that:
          - update_scope in ['all', 'security']
          - update_mode in ['apply', 'check']
        fail_msg: "update_scope は all / security、update_mode は apply / check を指定してください (現在: {{ update_scope }} / {{ update_mode }})"

    - name: 更新内容を表示
      ansible.builtin.debug:
        msg:
          - "モード : {{ update_mode }}"
          - "更新範囲 : {{ update_scope }}"
          - "対象パッケージ : {{ update_package_list if update_package_list | length > 0 else '(すべて)' }}"

    # --- 確認のみ (update_mode=check): 更新の有無と対応する CVE を調べるだけで、何も変更しない ---
    # dnf check-update の終了コード: 100=更新あり / 0=更新なし / 1=エラー
    - name: 更新の有無を確認 (変更なし)
      ansible.builtin.command:
        argv: >-
          {{ ['dnf', '-q', 'check-update']
          + (['--security'] if update_scope == 'security' else [])
          + update_package_list }}
      register: check_update
      changed_when: false
      failed_when: check_update.rc not in [0, 100]
      when: update_mode == 'check'

    # 未適用の CVE とパッケージの対応 (dnf updateinfo list cves: "CVE-xxxx 重要度 パッケージ(NEVRA)")
    - name: 未適用 CVE の一覧を取得 (変更なし)
      ansible.builtin.command: dnf -q updateinfo list cves
      register: cve_updateinfo
      changed_when: false
      failed_when: false
      when: update_mode == 'check'

    - name: 更新対象パッケージと CVE を突き合わせ
      ansible.builtin.set_fact:
        available_updates: >-
          {{ check_update.stdout_lines
          | select('match', '^\S+\.(x86_64|noarch|aarch64|i686|s390x|ppc64le)\s')
          | map('split') | list }}
        cve_entries: >-
          {%- set ns = namespace(items=[]) -%}
          {%- for line in cve_updateinfo.stdout_lines | default([]) -%}
          {%- set f = line.split() -%}
          {%- if f | length >= 3 and f[0] is match('^CVE-') -%}
          {%- set pkg = f[2] | regex_replace('\.[^.]+$', '') | regex_replace('-[^-]+-[^-]+$', '') -%}
          {%- set ns.items = ns.items + [{'cve': f[0], 'severity': f[1], 'package': pkg}] -%}
          {%- endif -%}
          {%- endfor -%}
          {{ ns.items }}
      when: update_mode == 'check'

    - name: 更新対象ごとの CVE を整理
      ansible.builtin.set_fact:
        update_report: >-
          {%- set ns = namespace(lines=[]) -%}
          {%- for u in available_updates -%}
          {%- set name = u[0] | regex_replace('\.[^.]+$', '') -%}
          {%- set hits = cve_entries | selectattr('package', 'equalto', name) | list -%}
          {%- set cves = hits | map(attribute='cve') | unique | sort | list -%}
          {%- set label = (cves | join(', ')) if cves | length > 0 else '-' -%}
          {%- set ns.lines = ns.lines + [u[0] ~ ' ' ~ u[1] ~ ' | CVE: ' ~ label] -%}
          {%- endfor -%}
          {{ ns.lines }}
        updates_with_cve: >-
          {{ available_updates
          | map('first') | map('regex_replace', '\.[^.]+$', '')
          | select('in', cve_entries | map(attribute='package') | list) | list | length }}
      when: update_mode == 'check'

    - name: 更新の確認結果を表示
      ansible.builtin.debug:
        msg:
          - "Host : {{ inventory_hostname }}"
          - "更新範囲 : {{ update_scope }} / 対象パッケージ : {{ update_package_list if update_package_list | length > 0 else '(すべて)' }}"
          - "更新 : {{ available_updates | length }} 件あり (うち CVE 未適用あり: {{ updates_with_cve }} 件)"
          - "{{ update_report }}"
          - "{{ '※ CVE 情報の取得に失敗しました (rc=' ~ cve_updateinfo.rc ~ '): ' ~ cve_updateinfo.stderr | default('') ~ ' → CVE 欄の - は「なし」ではなく「不明」です' if cve_updateinfo.rc != 0 else 'CVE 情報: 取得済み (CVE 欄の - は未適用 CVE なし)' }}"
      when: update_mode == 'check'

    # update_scope=security なら security: true、update_packages 指定ありならその名前だけを対象にする
    - name: パッケージを最新化 (OSパッチ適用)
      ansible.builtin.dnf:
        name: "{{ update_package_list if update_package_list | length > 0 else '*' }}"
        state: latest
        update_only: true
        security: "{{ update_scope == 'security' }}"
      when: update_mode == 'apply'

    # ============================================================
    # 2. Reboot必要性確認
    # ============================================================
    - name: Check if reboot is required
      ansible.builtin.command:
        cmd: needs-restarting -r
      register: reboot_check
      changed_when: false
      failed_when: false
      when: update_mode == 'apply'

    - name: Set reboot required
      ansible.builtin.set_fact:
        reboot_required: "{{ reboot_check.rc != 0 }}"
      when: update_mode == 'apply'

    - name: Show reboot requirement
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "REBOOT CHECK"
          - "Host : {{ inventory_hostname }}"
          - "Reboot Required : {{ reboot_required }}"
          - "=========================================="
      when: update_mode == 'apply'

    - name: Reboot server 
      ansible.builtin.reboot:
        reboot_timeout: "{{ reboot_timeout }}"
        test_command: whoami
        msg: "Reboot requested by Ansible RHEL patch Playbook"
      when:
        - update_mode == 'apply'
        - reboot_after_patch | bool
        - reboot_required | bool
  