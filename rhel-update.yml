---
- name: "RHEL Update and Reboot Playbook"
  hosts: all
  gather_facts: true
  become: true # root 権限で実行
  vars:
    region: "ap-northeast-1"
    reboot_after_patch: true # OSパッチ適用後に再起動するか
    reboot_timeout: 600

  tasks:
    - name: inventoryで登録されているホスト一覧を取得
      ansible.builtin.debug:
        msg: "対象ホスト: {{ inventory_hostname }} のパッケージを最新に更新します"

    # --------------------------------------------------
    # 1. OS パッチの最新化
    # --------------------------------------------------
    - name: すべてのパッケージを最新化 (OSパッチ適用)
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_cache: true

    # ============================================================
    # 2. Reboot必要性確認
    # ============================================================
    - name: Check if reboot is required
      ansible.builtin.command:
        cmd: needs-restarting -r
      register: reboot_check
      changed_when: false
      failed_when: false

    - name: Set reboot required
      ansible.builtin.set_fact:
        reboot_required: "{{ reboot_check.rc != 0 }}"

    - name: Show reboot requirement
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "REBOOT CHECK"
          - "Host : {{ inventory_hostname }}"
          - "Reboot Required : {{ reboot_required }}"
          - "=========================================="
  
    - name: Reboot server 
      ansible.builtin.reboot:
        reboot_timeout: "{{ reboot_timeout }}"
        test_command: whoami
        msg: "Reboot requested by Ansible RHEL patch Playbook"
      when:
        - reboot_after_patch | bool
        - reboot_required | bool
  