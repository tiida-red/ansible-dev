- name: ansible-playbook-sample
  hosts: localhost
  vars:
    region: ap-northeast-1
    cidr_block: 10.20.0.0/16
    vpc_name: vpc-dev

  tasks:
    - name: Create a VPC with dedicated tenancy and a couple of tags
      amazon.aws.ec2_vpc_net:
        name: "{{ vpc_name }}"
        cidr_block: "{{ cidr_block }}"
        region:  "{{ region }}"
        tags:
          module: ec2_vpc_net
        tenancy: default
      register: vpc

    - name: Create a new subnet using net-id
      amazon.aws.ec2_vpc_subnet:
        state: present
        vpc_id: "{{ vpc.vpc.id }}"
        cidr: {{ cidr_block | ansible.utils.cidrsubnet(4, 1) }}
        region:  "{{ region }}"
        map_public: true  # ★パブリックIP自動割り当てを有効化
        tags:
          module: ec2_vpc_public_subnet
      register: public_subnet
    - name: Create a new subnet using net-name
      amazon.aws.ec2_vpc_subnet:
        state: present
        cidr: {{ cidr_block | ansible.utils.cidrsubnet(4, 2) }}
        region:  "{{ region }}"
        tags:
          module: ec2_vpc_private_subnet
      register: private_subnet
    - name: Create a new Internet Gateway attached to the VPC
      amazon.aws.ec2_vpc_igw:
        vpc_id: "{{ vpc.vpc.id }}"
        region:  "{{ region }}"
        tags:
          Name: "{{ vpc_name }}-igw"
        state: present
      register: IGW
    - name: Create a new NAT Gateway attached to the VPC
      amazon.aws.ec2_vpc_nat_gateway:
        state: present
        subnet_id: "{{ public_subnet.subnet.id }}"
        region:  "{{ region }}"
        tags:
          Name: "{{ vpc_name }}-nat-gateway"
        if_exist_do_not_create: true
        wait: true
      register: NAT
    - name: Create a new public route table
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ vpc.vpc.id }}"
        region:  "{{ region }}"
        tags:
          Name: "{{ vpc_name }}-public-route-table"
        subnets:
        - "{{ public_subnet.subnet.id }}"
        routes:
        - dest: 0.0.0.0/0
          gateway_id: "{{ IGW.gateway_id }}"
        state: present
      register: public_route_table
    - name: Create a new private route table
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ vpc.vpc.id }}"
        region:  "{{ region }}"
        tags:
          Name: "{{ vpc_name }}-private-route-table"
        subnets:
        - "{{ private_subnet.subnet.id }}"
        routes:
        - dest: 0.0.0.0/0
          nat_gateway_id: "{{ NAT.nat_gateway_id }}"
                  state: present
     register: private_route_table
