---
- name: EC2ホストを検出してRoute 53へAレコード登録
  hosts: localhost
  gather_facts: false
  vars:
    region: "ap-northeast-1"
    target_hostname: "my-rhel-server"    # 検出対象のEC2インスタンス名（Nameタグ）
    hosted_zone_name: "example.com"       # Route 53のパブリック/プライベートホストゾーン名

  tasks:
    # --------------------------------------------------
    # 1. NameタグからターゲットEC2インスタンス情報を取得
    # --------------------------------------------------
    - name: get EC2 instance info by Name tag
      amazon.aws.ec2_instance_info:
        region: "{{ region }}"
        filters:
          "tag:Name": "{{ target_hostname }}"
          "instance-state-name": "running"
      register: ec2_info

    - name: show EC2 instance info for debugging
      ansible.builtin.debug:
        msg: "EC2インスタンス情報: {{ ec2_info.instances }}"

    - name: インスタンスが存在するか確認
      ansible.builtin.assert:
        that:
          - ec2_info.instances | length > 0
        fail_msg: "指定された Name タグ '{{ target_hostname }}' の実行中インスタンスが見つかりません。"

    - name: 検出されたIPアドレスを変数にセット
      ansible.builtin.set_fact:
        private_ip: "{{ ec2_info.instances[0].private_ip_address }}" # プライベートIPアドレスを取得
        public_ip: "{{ ec2_info.instances[0].public_ip_address }}"   # パ

    # --------------------------------------------------
    # IPアドレスを表示
    # --------------------------------------------------
    - name: 検出されたIPアドレスを表示
      ansible.builtin.debug:
        msg:
          - "Private IP: {{ private_ip }}"
          - "Public IP: {{ public_ip }}"

    # --------------------------------------------------
    # 2. Route 53 ホストゾーンの存在確認
    # --------------------------------------------------
    - name: Route 53 ホストゾーン情報の取得
      amazon.aws.route53_info:
        query: hosted_zone
      register: route53_zones

    - name: Route 53 ホストゾーン情報を表示
      ansible.builtin.debug:
        msg: "Route 53 ホストゾーン情報: {{ route53_zones.hosted_zones }}"

    #--------------------------------------------------
    # Public ゾーンIDを取得
    #--------------------------------------------------
    - name: Public Hosted Zone IDを取得
      ansible.builtin.set_fact:
        public_hosted_zone_id: >-
          {{
            route53_zones.hosted_zones
            | selectattr('name', 'equalto', hosted_zone_name + '.')
            | selectattr('config.private_zone', 'equalto', true)
            | map(attribute='id')
            | map('regex_replace', '^/hostedzone/', '')
            | first
          }}
    # ==================================================
    # 5. Private Hosted ZoneのZone IDを取得
    # ==================================================
    - name: Private Hosted Zone IDを取得
      ansible.builtin.set_fact:
            private_hosted_zone_id: >-
              {{
                route53_zones.hosted_zones
                | selectattr('name', 'equalto', hosted_zone_name + '.')
                | selectattr('config.private_zone', 'equalto', true)
                | map(attribute='id')
                | map('regex_replace', '^/hostedzone/', '')
                | first
              }}
    # ==================================================
    # 6. Hosted Zoneが正しく取得できたか確認
    # ==================================================
    - name: Hosted Zone IDを表示
      ansible.builtin.debug:
        msg:
          - "Public Hosted Zone ID: {{ public_hosted_zone_id }}"
          - "Private Hosted Zone ID: {{ private_hosted_zone_id }}"

    - name: Public Hosted Zoneが存在することを確認
      ansible.builtin.assert:
        that:
          - public_hosted_zone_id is defined
          - public_hosted_zone_id != ""
          - public_hosted_zone_id != None
        fail_msg: >-
          Public Hosted Zone '{{ hosted_zone_name }}' が
          Route 53に見つかりません。

    - name: Private Hosted Zoneが存在することを確認
      ansible.builtin.assert:
        that:
          - private_hosted_zone_id is defined
          - private_hosted_zone_id != ""
          - private_hosted_zone_id != None
        fail_msg: >-
          Private Hosted Zone '{{ hosted_zone_name }}' が
          Route 53に見つかりません。

    # ==================================================
    # 7. Public Hosted ZoneへAレコード登録
    # ==================================================

    - name: Public Hosted ZoneへAレコードを登録
      amazon.aws.route53:
        state: present
        hosted_zone_id: "{{ public_hosted_zone_id }}"
        record: "{{ target_hostname }}.{{ hosted_zone_name }}"
        type: A
        ttl: 300
        value:
          - "{{ public_ip }}"
        overwrite: true
      when:
        - public_ip != ""

    # ==================================================
    # 8. Private Hosted ZoneへAレコード登録
    # ==================================================

    - name: Private Hosted ZoneへAレコードを登録
      amazon.aws.route53:
        state: present
        hosted_zone_id: "{{ private_hosted_zone_id }}"
        record: "{{ target_hostname }}.{{ hosted_zone_name }}"
        type: A
        ttl: 300
        value:
          - "{{ private_ip }}"
        overwrite: true

    - name: 実行結果の確認
      ansible.builtin.debug:
        msg:
          - "DNSレコード: {{ target_hostname }}.{{ hosted_zone_name }}"
          - "Public  → {{ public_ip }}"
          - "Private → {{ private_ip }}"