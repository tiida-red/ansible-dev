---
- name: Find AWS subnet
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    aws_region: us-east-2
    vpc_id: vpc-xxxxxxxxxxxxxxxxx

    # 検索条件
    subnet_type: private
    availability_zone: us-east-2a

  tasks:
    # ------------------------------------------------------------
    # 1. Subnet取得
    # ------------------------------------------------------------
    - name: Get subnets
      amazon.aws.ec2_vpc_subnet_info:
        region: "{{ aws_region }}"
        filters:
          vpc-id: "{{ vpc_id }}"
      register: subnet_info

    # ------------------------------------------------------------
    # 2. Subnet一覧を作成
    # ------------------------------------------------------------
    - name: Build subnet list
      ansible.builtin.set_fact:
        subnet_list: >-
          {{
            subnet_list | default([]) +
            [{
              'subnet_id': item.subnet_id,
              'az': item.availability_zone,
              'cidr': item.cidr_block,
              'name': item.tags.Name | default('')
            }]
          }}
      loop: "{{ subnet_info.subnets }}"

    # ------------------------------------------------------------
    # 3. Subnet一覧を表示
    # ------------------------------------------------------------
    - name: Show subnet list
      ansible.builtin.debug:
        var: subnet_list

    - name: Select requested subnet
      ansible.builtin.set_fact:
        selected_subnets: >-
          {{
            subnet_info.subnets
            | selectattr(
                'availability_zone',
                'equalto',
                availability_zone
              )
            | selectattr(
                'tags.Name',
                'search',
                '(?i)' + subnet_type
              )
            | list
          }}
    # ------------------------------------------------------------
    # 4. 選択したSubnetを表示
    # ------------------------------------------------------------
    - name: Show selected subnet
      ansible.builtin.debug:
        var: selected_subnets

    # ------------------------------------------------------------
    # 5. Subnetがない場合
    # ------------------------------------------------------------
    - name: Fail if no subnet found
      ansible.builtin.fail:
        msg: >-
          No {{ subnet_type }} subnet found in
          {{ availability_zone }}.
      when: selected_subnets | length == 0

    # ------------------------------------------------------------
    # 6. 複数Subnetがある場合
    # ------------------------------------------------------------
    - name: Fail if multiple subnets found
      ansible.builtin.fail:
        msg: >-
          Multiple {{ subnet_type }} subnets found in
          {{ availability_zone }}:
          {{ selected_subnets | map(attribute='subnet_id') | list }}
      when: selected_subnets | length > 1

    # ------------------------------------------------------------
    # 7. Subnet IDを取得
    # ------------------------------------------------------------
    - name: Set selected subnet ID
      ansible.builtin.set_fact:
        selected_subnet_id: "{{ selected_subnets[0].subnet_id }}"

    # ------------------------------------------------------------
    # 8. 結果表示
    # ------------------------------------------------------------
    - name: Show selected subnet
      ansible.builtin.debug:
        msg:
          subnet_id: "{{ selected_subnet_id }}"
          name: "{{ selected_subnets[0].tags.Name }}"
          type: "{{ subnet_type }}"
          availability_zone: "{{ availability_zone }}"