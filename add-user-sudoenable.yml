---
- name: RHEL ユーザー作成と sudo/SSH 鍵設定
  hosts: localhost
  gather_facts: false
  vars:
    region: "ap-northeast-1"
    # 対象のインスタンス名（Nameタグ）を指定
    target_hostname: "my-rhel-server" 
    # デフォルトのユーザー名（実行時に -e new_username=xxx で上書き可能）
    new_username: "developer"
    # 公開鍵のコピー元ユーザー（EC2標準の既存ユーザー）
    source_ssh_user: "ec2-user"

  tasks:
    # --------------------------------------------------
    # 1. ホスト名(Nameタグ)からEC2インスタンス情報を取得し、動的インベントリに追加
    # --------------------------------------------------
    - name: ホスト名(Nameタグ)からEC2インスタンス情報を取得
      amazon.aws.ec2_instance_info:
        region: "{{ region }}"
        filters:
          "tag:Name": "{{ target_hostname }}"
          "instance-state-name": "running"
      register: ec2_info

    - name: インスタンスが見つかったか確認
      ansible.builtin.assert:
        that:
          - ec2_info.instances | length > 0
        fail_msg: "指定されたホスト名 '{{ target_hostname }}' の実行中インスタンスが見つかりません。"

    - name: ターゲットホストを動的インベントリに追加
      ansible.builtin.add_host:
        name: "{{ ec2_info.instances[0].private_ip_address }}" # public_ip_address または private_ip_address
        groups: target_rhel_servers
        new_username: "{{ new_username }}"
        source_ssh_user: "{{ source_ssh_user }}"

- name: ユーザー作成
  hosts: target_rhel_servers
  become: true # root 権限で実行
  gather_facts: true

  tasks:
    # --------------------------------------------------
    # 2. ユーザーの作成
    # --------------------------------------------------
    - name: 変数確認
      ansible.builtin.debug:
        msg: "新規ユーザー名: {{ new_username }}, 公開鍵コピー元ユーザー: {{ source_ssh_user }}"  
    
    - name: ユーザー作成
      ansible.builtin.user:
        name: "{{ new_username }}"
        state: present
        shell: /bin/bash
        create_home: true

    # --------------------------------------------------
    # 3. パスワードなし sudo の設定 (sudoers)
    # --------------------------------------------------
    - name: /etc/sudoers.d ディレクトリが存在することを確認・作成
      ansible.builtin.file:
        path: /etc/sudoers.d
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: /etc/sudoers.d にパスワードなし sudo 設定を追加
      ansible.builtin.copy:
        content: "{{ new_username }} ALL=(ALL) NOPASSWD:ALL\n"
        dest: "/etc/sudoers.d/{{ new_username }}"
        owner: root
        group: root
        mode: "0440"
        validate: "/usr/sbin/visudo -cf %s" # 構文チェックを実施して壊れた設定を未然に防止

    # --------------------------------------------------
    # 4. ec2-user の SSH 公開鍵を取得・コピー
    # --------------------------------------------------
    - name: "元ユーザー の authorized_keys から公開鍵を取得"
      ansible.builtin.slurp:
        src: "/home/{{ source_ssh_user }}/.ssh/authorized_keys"
      register: source_authorized_keys

    - name: 新規ユーザーへ SSH 公開鍵を設定
      ansible.builtin.authorized_key:
        user: "{{ new_username }}"
        state: present
        key: "{{ source_authorized_keys.content | b64decode }}"