---
- name: AWS EC2 Key Pair 登録 Playbook
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # 登録するキーペアの名前
    key_name: "my-ec2-keypair"
    # 対象のAWSリージョン
    aws_region: "ap-northeast-1"
    # ローカルのSSH公開鍵ファイルのパス
    public_key: "public_key"

  tasks:
    - name: 変数で指定された公開鍵をAWSに登録
      amazon.aws.ec2_key:
        name: "{{ key_name }}"
        key_material: "{{ public_key }}"
        region: "{{ aws_region }}"
        state: present
      register: ec2_key_result

    - name: 登録結果の確認
      ansible.builtin.debug:
        msg:
          - "キーペア '{{ ec2_key_result.key.name }}' の登録完了"
          - "AWS上のフィンガープリント: {{ ec2_key_result.key.fingerprint }}"