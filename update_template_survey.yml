---
- name: Update Job Template Survey Options
  hosts: localhost
  gather_facts: false
  vars:
    # --- 接続情報 ---
    aap_controller_url: "https://ec2-3-25-173-252.ap-southeast-2.compute.amazonaws.com/"
    aap_username: "admin"
    aap_password: "Your password"

    # --- 変更対象のテンプレート情報 ---
    target_job_template_name: "Check_Package"

    # --- 新しい Survey 定義 (JSON/YAML 構造) ---
    new_survey_spec:
      name: "Package Version Check Survey"
      description: "Survey for package version checking parameters"
      spec:
        - question_name: "ターゲットパッケージ選択"
          question_description: "チェックするパッケージを選択してください"
          variable: "target_package"
          type: "singlechoice"  # ドロップダウンリスト
          required: true
          default: "bash"
          # ★ここでドロップダウンのリスト項目（選択肢）を更新します
          choices:
            - "bash"
            - "vim"
            - "nano"
            - "ansible-core"
            - "python3"
            - "openssh"

  tasks:
    - name: Update Survey spec in Automation Controller
      redhat.ansible_automation_platform.job_template:
        controller_host: "{{ aap_controller_url }}"
        controller_username: "{{ aap_username }}"
        controller_password: "{{ aap_password }}"
        validate_certs: false
        name: "{{ target_job_template_name }}"
        survey_enabled: true
        survey_spec: "{{ new_survey_spec }}"
      register: survey_update_result

    - name: Display result
      ansible.builtin.debug:
        msg: "ジョブテンプレート '{{ target_job_template_name }}' の Survey リスト項目を正常に更新しました。"