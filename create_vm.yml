---
- name: AWS playbook
  hosts: localhost
  connection: local
  collections:
    - amazon.aws
  vars:
    region:  ap-northeast-1
    instance_name: rhel10-demo
    hostname: "{{ instance_name }}"
    instance_type: t3.micro
    ami_id: ami-0xxxxxxxxxxxxxxxxx
    root_volume_size: 30
    key_name: my-key-pair
  tasks:
    - name: discover existing VPCs in the target region
      amazon.aws.ec2_vpc_net_info:
        region: "{{ region }}"
        filters:
          state: available
      register: vpc_info

    - name: fail if no VPC is found
      ansible.builtin.fail:
        msg: "No VPC found in region {{ region }}"
      when: vpc_info.vpcs | length == 0

    - name: select the first detected VPC
      ansible.builtin.set_fact:
        existing_vpc_id: "{{ vpc_info.vpcs[0].vpc_id }}"
        existing_vpc_cidr: "{{ vpc_info.vpcs[0].cidr_block }}"

    - name: show the selected VPC
      ansible.builtin.debug:
        msg: "Using existing VPC {{ existing_vpc_id }} (CIDR {{ existing_vpc_cidr }})"

    - name: discover existing public subnets in the selected VPC
      amazon.aws.ec2_vpc_subnet_info:
        region: "{{ region }}"
        filters:
          vpc-id: "{{ existing_vpc_id }}"
          map-public-ip-on-launch: "true"
      register: subnet_info

    - name: fail if no subnet is found in the selected VPC
      ansible.builtin.fail:
        msg: "No subnet found in VPC {{ existing_vpc_id }}"
      when: subnet_info.subnets | length == 0

    - name: select a random existing public subnet
      ansible.builtin.set_fact:
        selected_subnet: "{{ subnet_info.subnets | random }}"

    - name: expose the selected subnet details
      ansible.builtin.set_fact:
        existing_subnet_id: "{{ selected_subnet.subnet_id }}"
        existing_subnet_cidr: "{{ selected_subnet.cidr_block }}"

    - name: show the selected subnet
      ansible.builtin.debug:
        msg: "Using existing subnet {{ existing_subnet_id }} (CIDR {{ existing_subnet_cidr }})"

    - name: create a new security group
      amazon.aws.ec2_security_group:
        name: my_security_group
        description: a security group for my ec2 instance
        vpc_id: "{{ existing_vpc_id }}"
        region: "{{ region }}"
        rules:
          - proto: tcp
            from_port: 22
            to_port: 22
            cidr_ip: 0.0.0.0/0
          - proto: tcp
            from_port: 443
            to_port: 443
            cidr_ip: 0.0.0.0/0
          - proto: tcp
            from_port: 80
            to_port: 80
            cidr_ip: 0.0.0.0/0
          - proto: all
            group_name: my_security_group
        rules_egress:
          - proto: all
            from_port: 0
            to_port: 65535
            cidr_ip: 0.0.0.0/0
      register: security_group

    - name: discover ami-id from os type and version
      amazon.aws.ec2_ami_info:
        region: "{{ region }}"
#        owners: "amazon"
        owners: "309956199498" ## Red Hat, Inc. (RHEL) owner ID
        filters:
          name: "RHEL-10*"
          architecture: "x86_64"
          state: "available"
      register: ami_info
    
    - name: show discovered ami-id
      ansible.builtin.debug:
        msg: "Discovered AMI ID {{ (ami_info.images | sort(attribute='creation_date') | last).image_id }} for RHEL 10 in region {{ region }}"
        when: ami_info.images | length > 0
  
    - name: launch an EC2 instance
      amazon.aws.ec2_instance:
        name: "{{ instance_name }}"
        key_name: "{{ key_name }}"
        instance_type: "{{ instance_type }}"
        image_id: "{{ (ami_info.images | sort(attribute='creation_date') | last).image_id }}"
        region: "{{ region }}"
        vpc_subnet_id: "{{ existing_subnet_id }}"
        security_group: "{{ security_group.group_id }}"
        tags:
          Name: "{{ hostname }}"
          Hostname: "{{ hostname }}"
        user_data: |
          #cloud-config
          write_files:
            - path: /etc/hostname
              content: |
                {{ hostname }}
              permissions: '0644'
          runcmd:
            - hostnamectl set-hostname {{ hostname }}
        volumes:
          - device_name: /dev/sda1
            ebs:
              volume_size: "{{ root_volume_size }}"
              volume_type: gp3
              delete_on_termination: true
        state: running
        wait: true
      register: ec2_instance

    - name: show created instance details
      ansible.builtin.debug:
        msg: "Created instance {{ ec2_instance.instances[0].instance_id }} in subnet {{ existing_subnet_id }}"

    - name: update packages on the instance
      amazon.aws.ec2_instance:
        instance_ids:
          - "{{ ec2_instance.instances[0].instance_id }}"
        region: "{{ region }}"
        state: running
        user_data: |
          #cloud-config
          package_update: true
          package_upgrade: true
          packages:
            - yum-utils
      register: updated_instance
