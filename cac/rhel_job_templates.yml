---
# rhel*.yml / rhel-*.yml の Playbook を AAP のジョブテンプレートとして登録する定義
# 新しい rhel Playbook を追加する場合は rhel_job_templates に追記してください。

# --- 共通設定 (環境に合わせて変更) ---
cac_organization: My Org
cac_project: My Project
# false: 既存プロジェクトをそのまま使う (プロジェクトの作成/更新をしない)
# true : 下の scm_* の設定でプロジェクトを作成/更新する
cac_manage_project: false
cac_project_scm_url: https://github.com/tiida-red/ansible-dev.git
cac_project_scm_branch: main
# 事前に AAP 上に作成済みの Source Control 認証情報 (プライベートリポジトリ用)
cac_project_scm_credential: ""
cac_inventory: my inventory
cac_machine_credential: RHEL
cac_execution_environment: ""  # 空の場合は組織/既定の EE を使用

# --- チェック結果レポート (Markdown を Git に push する) ---
# 非公開のリポジトリを指定すること (レポートにはホスト名や CVE の状況が含まれる)
cac_report_git_repo: "https://github.com/tiida-red/ansible-update-reports.git"  # 例: https://github.com/<org>/<非公開リポジトリ>.git
# Git のトークンを入れた AAP の認証情報 (種類: Report Git Token) の名前。AAP の画面で作成する
cac_report_credential: ""

# --- OS 別アップデート用ジョブテンプレートとワークフローで共通の Survey ---
update_survey: &update_survey
  name: Update options
  description: 対象 OS・実行モード・更新範囲・対象パッケージ
  spec:
    - question_name: 対象 OS
      question_description: all=すべて / それ以外は選んだ OS のホストだけを処理 (他の OS のホストはスキップ)
      variable: target_os
      type: multiplechoice
      required: true
      default: all
      choices:
        - all
        - rhel
        - sles
        - ubuntu
    - question_name: 実行モード
      question_description: apply=更新を実行 / check=更新の有無を確認するだけ(何も変更しない・再起動もしない)
      variable: update_mode
      type: multiplechoice
      required: true
      default: apply
      choices:
        - apply
        - check
    - question_name: 更新範囲
      question_description: all=すべての更新 / security=セキュリティ更新のみ
      variable: update_scope
      type: multiplechoice
      required: true
      default: all
      choices:
        - all
        - security
    - question_name: 対象パッケージ (カンマ区切り)
      question_description: 空欄=すべて / 例 kernel,openssl。SLES では update_scope=security と同時に指定できません
      variable: update_packages
      type: text
      required: false
      default: ""
    - question_name: 更新後に再起動する
      question_description: 再起動が必要な場合のみ実際に再起動します
      variable: reboot_after_patch
      type: multiplechoice
      required: true
      default: "true"
      choices:
        - "true"
        - "false"

# --- ワークフロー: 3 つの OS 別テンプレートを順に実行する (自分の OS 以外のホストは各テンプレートがスキップ) ---
update_workflows:
  - name: Update - All distributions
    description: RHEL 系 → SLES → Ubuntu の順に更新を実行/確認し、確認モードなら最後にレポートを Git に push する。Survey の「対象 OS」で OS を選べる
    survey_spec: *update_survey
    # 実行順 (前のジョブが失敗しても次へ進む)
    order:
      - RHEL - Update and Reboot
      - SLES - Update and Reboot
      - Ubuntu - Update and Reboot
      - Update - Publish Check Report

rhel_job_templates:
  - name: RHEL - Register Subscription
    playbook: rhel_register.yml
    description: subscription-manager でシステムを登録する
    become_enabled: true
    ask_variables_on_launch: true
    survey_enabled: true
    survey_spec:
      name: RHSM registration
      description: Red Hat Subscription Manager の認証情報
      spec:
        - question_name: RHSM ユーザー名
          variable: rhsm_username
          type: text
          required: true
        - question_name: RHSM パスワード
          variable: rhsm_password
          type: password
          required: true

  - name: RHEL - Firewall
    playbook: rhel-firewall.yml
    description: firewalld のサービス/ポートの許可(open)・削除(close)
    become_enabled: true
    survey_enabled: true
    survey_spec:
      name: Firewall settings
      description: 許可または削除するサービスとポート
      spec:
        - question_name: 操作
          question_description: enabled=許可(open) / disabled=削除(close) / status=現状確認のみ(変更しない)
          variable: fw_state
          type: multiplechoice
          required: true
          default: enabled
          choices:
            - enabled
            - disabled
            - status
        - question_name: サービス名 (カンマ区切り)
          question_description: 例 http,https  (不要なら空欄)
          variable: fw_services
          type: text
          required: false
          default: "http,https"
        - question_name: ポート (カンマ区切り)
          question_description: 例 8080/tcp,8443/tcp  (不要なら空欄)
          variable: fw_ports
          type: text
          required: false
          default: "8080/tcp,8443/tcp"

  - name: RHEL - Install Package
    playbook: rhel-install_package.yml
    description: パッケージのインストール/削除
    become_enabled: true
    survey_enabled: true
    survey_spec:
      name: Package install
      description: 対象パッケージと状態
      spec:
        - question_name: 対象パッケージ
          variable: target_package
          type: text
          required: true
          default: bash
        - question_name: 状態
          variable: package_state
          type: multiplechoice
          required: true
          default: present
          choices:
            - present
            - absent

  - name: RHEL - SSM Agent
    playbook: rhel-ssm-agent.yml
    description: AWS Systems Manager Agent のインストールと有効化
    become_enabled: true
    ask_variables_on_launch: true

  - name: RHEL - Update and Reboot
    playbook: rhel-update.yml
    description: OS パッチ適用と必要時の再起動 (dnf を使う OS 用。それ以外のホストはスキップ)
    become_enabled: true
    survey_enabled: true
    survey_spec: *update_survey
    timeout: 3600

  - name: SLES - Update and Reboot
    playbook: sles-update.yml
    description: SLES のパッチ適用と必要時の再起動 (zypper を使う OS 用。それ以外のホストはスキップ)
    become_enabled: true
    survey_enabled: true
    survey_spec: *update_survey
    timeout: 3600

  - name: Ubuntu - Update and Reboot
    playbook: ubuntu-update.yml
    description: Ubuntu の更新適用と必要時の再起動 (apt を使う OS 用。それ以外のホストはスキップ)
    become_enabled: true
    survey_enabled: true
    survey_spec: *update_survey
    timeout: 3600

  - name: Update - Publish Check Report
    playbook: update-report.yml
    description: 確認モードの結果を Markdown のレポートにして Git に push する (ワークフローの最後のノード)
    become_enabled: false
    # 前段のジョブから引き継ぐデータ (set_stats) を受け取るために必要
    ask_variables_on_launch: true
    # ワークフローの Limit を受け取らない (localhost で実行するため)
    ask_limit_on_launch: false
    extra_vars:
      report_git_repo: "{{ cac_report_git_repo }}"
    extra_credentials:
      - "{{ cac_report_credential }}"

  - name: RHEL - Package Search
    playbook: rhel-package-search.yml
    description: パッケージ名(ワイルドカード可)や CVE でホストを抽出 (参照のみ。パッケージと CVE はそれぞれ独立して検索可)
    become_enabled: true
    survey_enabled: true
    survey_spec:
      name: Package search
      description: パッケージと CVE (どちらか一方だけでも可。両方空はエラー)
      spec:
        - question_name: パッケージ名 (任意・カンマ区切り、* 使用可)
          question_description: 例 php*  /  kernel*,openssl  (空欄ならパッケージ検索なし)
          variable: search_packages
          type: text
          required: false
          default: ""
        - question_name: CVE 番号 (任意・カンマ区切り)
          question_description: 例 CVE-2024-1234  (空欄なら CVE チェックなし)
          variable: cve_ids
          type: text
          required: false
          default: ""

  - name: RHEL - Add Swap
    playbook: rhel-swap.yml
    description: スワップファイルを作成して有効化し、/etc/fstab に登録する (再実行しても安全)
    become_enabled: true
    survey_enabled: true
    survey_spec:
      name: Swap settings
      description: スワップファイルの設定
      spec:
        - question_name: スワップサイズ (MB)
          question_description: 既定 2048。/swapfile が既にある場合はサイズを変更しません。
          variable: swap_size_mb
          type: integer
          required: true
          default: 2048
          min: 256
          max: 32768
